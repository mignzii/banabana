# TEST : Dashboard Grossiste — stats, CTA, commandes récentes
appId: com.banabana.pro
env:
  WHOLESALER_PHONE: "+2250700000020"
---
- launchApp:
    clearState: true
- runFlow: ../flows/_login_wholesaler.yaml

- tapOn: "Tableau de bord"
- assertVisible: "(?s)Bienvenue.*BanaBana Shop.*"

# ── Cartes statistiques ───────────────────────────────────────────────────────
- assertVisible: "(?s).*Commandes"
- assertVisible: "(?s).*Dépenses FCFA"
- assertVisible: "(?s).*En cours"
- assertVisible: "(?s).*Livrées"

# ── Bouton explorer le catalogue ──────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Explorer le catalogue"
    direction: DOWN
- tapOn: "Explorer le catalogue"
- assertVisible: "Catalogue"
- tapOn: "(?s)Accueil.*"

# ── Section commandes récentes ────────────────────────────────────────────────
- tapOn: "Tableau de bord"
- scrollUntilVisible:
    element:
      text: "Commandes récentes"
    direction: DOWN
- assertVisible: "Commandes récentes"
- assertVisible: "Voir tout"
- tapOn: "Voir tout"
- assertVisible: "Mes commandes"
- tapOn: "Retour"
- assertVisible: "(?s)Bienvenue.*BanaBana Shop.*"
