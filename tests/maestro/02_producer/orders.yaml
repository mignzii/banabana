# TEST : Commandes Producteur — liste, filtres, détail, accepter/refuser/expédier
# Prérequis : une commande en attente doit exister (créée par le flow cross-role)
appId: com.banabana.pro
env:
  PRODUCER_PHONE: "+2250700000013"
---
- launchApp:
    clearState: true
- runFlow: ../flows/_login_producer.yaml

- tapOn: "Commandes"
- assertVisible: "Commandes Reçues"

# ── Vérification des filtres ──────────────────────────────────────────────────
- assertVisible: "(?s)Tous.*"
- assertVisible: "(?s)Nouvelles.*"
- assertVisible: "(?s)En cours.*"
# Les derniers filtres sont hors écran : défilement horizontal de la barre
- swipe:
    start: "85%,16%"
    end: "15%,16%"
- assertVisible: "(?s)Expédiées.*"
- assertVisible: "(?s)Annulées.*"
- swipe:
    start: "15%,16%"
    end: "85%,16%"

# Filtre "Nouvelles"
- tapOn: "(?s)Nouvelles.*"
- assertVisible: "(?s)Nouvelles.*"

# Filtre "En cours"
- tapOn: "(?s)En cours.*"
- assertVisible: "(?s)En cours.*"

# Filtre "Tous"
- tapOn: "(?s)Tous.*"

# ── Vérification carte de commande ────────────────────────────────────────────
# Si des commandes existent :
- scrollUntilVisible:
    element:
      text: "Grossiste"
    direction: DOWN
    optional: true

# ── Détail commande ───────────────────────────────────────────────────────────
# (uniquement si le compte de test a des commandes)
- runFlow:
    when:
      visible: ".*#.*"
    commands:
      - tapOn:
          index: 0
          text: ".*#.*"
      - assertVisible: "Détail commande"
      - assertVisible: ".*Articles commandés.*"
      - assertVisible: ".*Sous-total.*"
      - tapOn: "Retour"

# ── Accepter une commande en attente ─────────────────────────────────────────
- tapOn: "(?s)Nouvelles.*"
- scrollUntilVisible:
    element:
      text: "Accepter"
    direction: DOWN
    optional: true
- tapOn:
    text: "Accepter"
    optional: true
- assertVisible:
    text: "Commande acceptée"
    optional: true

# ── Refuser une commande en attente ──────────────────────────────────────────
- tapOn: "(?s)Nouvelles.*"
- scrollUntilVisible:
    element:
      text: "Refuser"
    direction: DOWN
    optional: true
- tapOn:
    text: "Refuser"
    optional: true

# ── Expédier une commande en cours ────────────────────────────────────────────
- tapOn: "(?s)En cours.*"
- tapOn:
    index: 0
    text: "#"
    optional: true
- scrollUntilVisible:
    element:
      text: "Expédier la commande"
    direction: DOWN
    optional: true
- tapOn:
    text: "Expédier la commande"
    optional: true
- assertVisible:
    text: "Commande expédiée"
    optional: true
- tapOn:
    text: "Retour"
    optional: true
