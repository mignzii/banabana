# TEST : Catégories Producteur — CRUD catégories
appId: com.banabana.pro
env:
  PRODUCER_PHONE: "+2250700000013"
  CATEGORY_NAME: "Tubercules Test"
  CATEGORY_SLUG: "tubercules-test"
  CATEGORY_NAME_EDITED: "Tubercules Modifié"
  CATEGORY_SLUG_EDITED: "tubercules-modifie"
---
- launchApp:
    clearState: true
- runFlow: ../flows/_login_producer.yaml

# Accès via le formulaire produit (bouton catégories)
- tapOn: "Accueil"
- tapOn: "Ajouter produit"
- tapOn: "Choisir une catégorie"
- tapOn: "Retour"

# Accès direct via le dashboard
- tapOn: "Tableau de bord"
- scrollUntilVisible:
    element:
      text: "Statistiques"
    direction: DOWN
- tapOn: "Retour"

# Accès via la navigation profonde (paramètres ou produit)
- tapOn: "Accueil"
- tapOn: "Ajouter produit"
- tapOn: "Choisir une catégorie"
- assertVisible: "Choisir une catégorie"
- tapOn: "Retour"
- tapOn: "Retour"

# ── CRÉER une catégorie ───────────────────────────────────────────────────────
# Naviguer vers l'écran catégories (via produits ou menu)
- tapOn: "Mes produits"
- tapOn: "Nouveau produit"
- assertVisible: "Nouveau produit"
- tapOn: "Retour"

# Retour à l'accueil pour trouver les catégories via un autre chemin
- tapOn: "Accueil"

# Note: categories screen accessible via /producer/categories (lien direct)
# Dans l'app, il est accessible depuis le profil ou via un produit existant.
# On teste ici via le sélecteur de catégorie dans le formulaire.

- tapOn: "Ajouter produit"
- tapOn: "Choisir une catégorie"
- assertVisible:
    anyOf:
      - text: "Fruits"
      - text: "Légumes"
      - text: "Céréales & Grains"
      - text: "Tubercules"
- tapOn:
    index: 0
- assertVisible: "Nouveau produit"
- tapOn: "Retour"
