# TEST : CRUD Produit — Créer, Lire, Modifier, Supprimer
appId: com.banabana.pro
env:
  PRODUCER_PHONE: "+2250700000013"
  PRODUCT_TITLE: "Bananes Plantain Test"
  PRODUCT_PRICE: "5000"
  VARIANT_LABEL: "Régime 12kg"
  VARIANT_PRICE: "4500"
  VARIANT_STOCK: "50"
  PRODUCT_TITLE_EDITED: "Bananes Plantain Modifié"
  PRODUCT_PRICE_EDITED: "5500"
---
- launchApp:
    clearState: true
- runFlow: ../flows/_login_producer.yaml

# ── Accès à la liste des produits ────────────────────────────────────────────
- tapOn: "Produits"
- assertVisible: "Ajouter un produit"

# ── CRÉER : assistant en 3 étapes (Infos → Prix → Finaliser) ─────────────────
- tapOn: "Nouveau produit"
- assertVisible: "Photos & Infos"
- assertVisible: "Nom du produit \\*"

# Validation : impossible de continuer sans nom ni catégorie
- tapOn: "Continuer"
- assertVisible: "Photos & Infos"

# Étape 1 — Infos
- tapOn: "Nom du produit \\*"
- inputText: "${PRODUCT_TITLE}"
- tapOn: "Photos & Infos"
- tapOn: "Choisir une catégorie"
- scrollUntilVisible:
    element:
      text: ".*Agriculture.*"
    direction: DOWN
- tapOn: ".*Agriculture.*"
- tapOn: "Description"
- inputText: "Bananes de qualité premium, origine Abidjan"
- tapOn: "Photos & Infos"
- tapOn: "Continuer"

# Étape 2 — Prix & variantes
- assertVisible: "Prix & Variantes"
# Le champ est fusionné avec le titre de la carte dans l'arbre d'accessibilité
- tapOn:
    point: "50%,36%"
- inputText: "${PRODUCT_PRICE}"
- tapOn: "Prix & Variantes"
- tapOn: "Ajouter une variante"
- tapOn: "Carton"
- tapOn: "Prix \\(FCFA\\) \\*"
- inputText: "${VARIANT_PRICE}"
- tapOn: "Stock \\*"
- inputText: "${VARIANT_STOCK}"
- tapOn: "Unité de vente \\*"
- tapOn: "Ajouter cette variante"
- assertVisible: ".*Carton.*"
- tapOn: "Continuer"

# Étape 3 — Récapitulatif puis création
- assertVisible: "(?s)Récapitulatif.*Agriculture.*"
- assertVisible: "(?s).*${PRODUCT_TITLE}.*"
- tapOn: "Créer le produit"

# ── LIRE : page détail (le produit est actif par défaut) ─────────────────────
- assertVisible: "Détail produit"
- assertVisible: "(?s)${PRODUCT_TITLE}.*Actif.*Agriculture.*"

# ── MODIFIER le produit ───────────────────────────────────────────────────────
- tapOn: "Modifier"
- assertVisible: "Modifier le produit"
- tapOn: "(?s).*Nom du produit.*"
- eraseText: 50
- inputText: "${PRODUCT_TITLE_EDITED}"
- tapOn: "Modifier le produit"
- scrollUntilVisible:
    element:
      text: "Mettre à jour"
    direction: DOWN
- tapOn: "Mettre à jour"
- assertVisible: "(?s)${PRODUCT_TITLE_EDITED}.*"

# ── SUPPRIMER le produit (menu ⋮) : annuler puis confirmer ───────────────────
- tapOn: "Afficher le menu"
- tapOn: "Supprimer"
- assertVisible: ".*Cette action est irréversible.*"
- tapOn: "Annuler"
- assertVisible: "(?s)${PRODUCT_TITLE_EDITED}.*"

- tapOn: "Afficher le menu"
- tapOn: "Supprimer"
- assertVisible: ".*Cette action est irréversible.*"
- tapOn: "Supprimer"
- assertVisible: "Aucun produit"
